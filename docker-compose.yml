services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: realtime, POSTGRES_USER: realtime, POSTGRES_PASSWORD: realtime }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U realtime"], interval: 5s, timeout: 5s, retries: 10 }
  migrate:
    build: .
    user: root
    env_file: .env
    command: ["npx","prisma","migrate","deploy"]
    depends_on: { db: { condition: service_healthy } }
  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  worker:
    build:
      context: .
      target: builder
    env_file: .env
    command: ["npm","run","worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
volumes: { postgres_data: {} }
